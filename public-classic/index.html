<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Freshness Radar</title>
<style>
  :root { --brand:#4B2A8C; --soft:#EFE9FB; --ink:#1A1530; --muted:#5E5A72; --line:#E4E1EC; --bg:#F6F5FA;
          --high:#C8303F; --high-bg:#FDECEE; --med:#B86E0A; --med-bg:#FFF4E2; --low:#2E7D4F; --low-bg:#E8F5EC; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  header { background:var(--brand); color:#fff; padding:16px 28px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:19px; margin:0; }
  .tag { font-size:12px; background:rgba(255,255,255,.18); padding:3px 10px; border-radius:99px; }
  .spacer { flex:1; }
  nav { background:#fff; border-bottom:1px solid var(--line); padding:0 28px; display:flex; gap:4px; }
  nav a { padding:13px 14px; color:var(--muted); text-decoration:none; border-bottom:2px solid transparent; font-weight:500; }
  nav a.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
  main { max-width:1150px; margin:0 auto; padding:24px 28px 60px; }
  h2 { font-size:16px; margin:22px 0 12px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .kpi .v { font-size:22px; font-weight:700; } .kpi .l { color:var(--muted); font-size:12.5px; margin-top:2px; }
  .kpi.red .v { color:var(--high); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .course { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; cursor:pointer; }
  .course:hover { box-shadow:0 2px 10px rgba(75,42,140,.12); }
  .course .name { font-weight:600; min-height:38px; }
  .row { display:flex; align-items:center; gap:12px; margin-top:8px; }
  .score { font-size:28px; font-weight:700; width:58px; }
  .meta { color:var(--muted); font-size:12.5px; }
  .badge { font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:6px; display:inline-block; }
  .Fresh { background:var(--low-bg); color:var(--low); } .Needs { background:var(--med-bg); color:var(--med); } .At { background:var(--high-bg); color:var(--high); }
  .High, .Certification { background:var(--high-bg); color:var(--high); } .Medium { background:var(--med-bg); color:var(--med); } .Low { background:var(--low-bg); color:var(--low); }
  .sample { background:#FCE4EE; color:#B0245C; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  select, textarea { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .flag { background:#fff; border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:8px; cursor:pointer; display:flex; gap:16px; justify-content:space-between; }
  .flag.High, .flag.Certification { border-left-color:var(--high); background:#fff; color:inherit; }
  .flag.Medium { border-left-color:var(--med); background:#fff; color:inherit; }
  .flag.Low { border-left-color:var(--low); background:#fff; color:inherit; }
  .flag .loc { font-weight:600; } .right { text-align:right; white-space:nowrap; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:14px 0; }
  .box { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .box .lbl { font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
  .quote { background:#FAF9FD; border-left:3px solid var(--brand); padding:10px 12px; border-radius:4px; white-space:pre-wrap; }
  .ai { background:#FCF8FF; border:1px dashed #C9B5F0; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button { font:600 13px "Segoe UI", sans-serif; border:0; border-radius:8px; padding:9px 14px; cursor:pointer; }
  .b-accept { background:var(--brand); color:#fff; } .b-dismiss { background:#fff; border:1px solid var(--line); } .b-fixed { background:var(--low); color:#fff; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px; }
  th { background:#FAF9FD; color:var(--muted); font-size:12px; }
  a { color:#6B3FC4; }
  .empty, .error { background:#fff; border:1px dashed var(--line); border-radius:10px; padding:24px; color:var(--muted); text-align:center; }
  .error { color:var(--high); }
  @media (max-width:760px) { .cols { grid-template-columns:1fr; } main { padding:16px; } }

  .run-btn { background:#fff; color:var(--brand); font-weight:700; border-radius:8px; padding:8px 14px; }
  .run-btn:disabled { opacity:.6; cursor:wait; }
  .run-panel { position:fixed; right:20px; bottom:20px; width:min(620px, 92vw); background:#1E1A2E; color:#E8E4F5;
               border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.3); z-index:20; }
  .run-panel.hidden { display:none; }
  .run-head { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid #3A3450; }
  .run-head .grow { flex:1; }
  .run-head button { background:transparent; color:#E8E4F5; padding:4px 8px; }
  #runLog { margin:0; padding:12px 14px; max-height:340px; overflow:auto; font:12.5px Consolas, monospace; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Course Freshness Radar</h1>
  <span class="tag">Vanguard training material</span>
  <span class="spacer"></span>
  <button class="run-btn" id="runBtn">▶ Run now</button>
  <span class="tag" id="aiSpend">AI spend: –</span>
</header>
<nav>
  <a href="#/" data-r="overview">Overview</a>
  <a href="#/flags" data-r="flags">Flags</a>
  <a href="#/news" data-r="news">Vendor news</a>
    <a href="#/emails" data-r="emails">Emails</a>
</nav>
<main id="app">Loading…</main>

<div class="run-panel hidden" id="runPanel">
  <div class="run-head">
    <b>Daily run</b><span class="grow" id="runStatus"></span>
    <button id="runClose" title="Hide">✕</button>
  </div>
  <pre id="runLog"></pre>
</div>

<script>
const app = document.getElementById('app');
const state = { courses: null };

// Escape text so course or news content can never break the page
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmtDate = (s) => (s ? new Date(s).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '–');
const statusClass = (s) => s.split(' ')[0]; // "Needs review" -> "Needs"

async function api(path, options) {
  const res = await fetch('/api' + path, options);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

// ---------------- Overview ----------------
async function viewOverview() {
  const d = await api('/overview');
  state.courses = d.courses;
  state.lastRun = d.lastRun;
  document.getElementById('aiSpend').textContent = `AI spend this month: $${d.ai.spent.toFixed(2)} / $${d.ai.cap.toFixed(2)}`;

  const open = d.courses.reduce((s, c) => s + c.open, 0);
  const high = d.courses.reduce((s, c) => s + c.high, 0);
  const kpi = (v, l, cls = '') => `<div class="kpi ${cls}"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`;
  const areas = [...new Set(d.courses.map((c) => c.area))];

  app.innerHTML = `
    <div class="kpis">
      ${kpi(d.courses.length, 'Courses monitored')}
      ${kpi(open, 'Open flags')}
      ${kpi(high, 'High / certification', high ? 'red' : '')}
      ${kpi(`${d.totals.relevantNews} / ${d.totals.news}`, 'Relevant vendor posts')}
      ${kpi(`${d.totals.files} / ${d.totals.chunks.toLocaleString()}`, 'Files / chunks indexed')}
            ${kpi(d.lastRun ? fmtDate(d.lastRun.startedAt) : 'Not yet',
            d.lastRun ? `Last daily run · ${d.lastRun.status === 'ok' ? '✅ OK' : '❌ failed'}` : 'Last daily run',
            d.lastRun?.status === 'failed' ? 'red' : '')}
    </div>
    ${areas.map((area) => `
      <h2>${esc(area)}</h2>
      <div class="grid">
        ${d.courses.filter((c) => c.area === area).map((c) => `
          <div class="course" data-course="${esc(c.course)}">
            <div class="name">${esc(c.course)}</div>
            <div class="row">
              <div class="score">${c.score}</div>
              <div>
                <span class="badge ${statusClass(c.status)}">${esc(c.status)}</span>
                <div class="meta">${c.high} high · ${c.medium} medium · ${c.low} low</div>
                <div class="meta">${c.files} files · ${c.chunks.toLocaleString()} chunks</div>
              </div>
            </div>
          </div>`).join('')}
      </div>`).join('')}`;

  app.querySelectorAll('.course').forEach((el) => {
    el.onclick = () => (location.hash = '#/flags?course=' + encodeURIComponent(el.dataset.course));
  });
}

// ---------------- Flags list ----------------
async function viewFlags(query) {
    if (!state.courses || !('lastRun' in state)) {
    const ov = await api('/overview');
    state.courses = ov.courses;
    state.lastRun = ov.lastRun;
  }
  const q = new URLSearchParams(query);
  const course = q.get('course') || '', impact = q.get('impact') || '', status = q.get('status') || 'open';
  const onlyNew = q.get('new') === '1';
  const rows = await api('/flags?' + new URLSearchParams({ course, impact, status, ...(onlyNew ? { new: '1' } : {}) }));
  const lastRunStart = state.lastRun?.startedAt || '';
  const isNew = (f) => lastRunStart && f.createdAt >= lastRunStart;
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label)}</option>`;

  app.innerHTML = `
       ${onlyNew ? `<p><b>Showing flags created in the latest run.</b> <a href="#/flags">Show all open flags</a></p>` : ''}
    <div class="toolbar">
      <select id="fCourse">${opt('', 'All courses', course)}${state.courses.map((c) => opt(c.course, c.course, course)).join('')}</select>
      <select id="fImpact">${['', 'Certification', 'High', 'Medium', 'Low'].map((i) => opt(i, i || 'All impact levels', impact)).join('')}</select>
      <select id="fStatus">${[['open', 'Open (New + Accepted)'], ['all', 'All'], ['New', 'New'], ['Accepted', 'Accepted'], ['Fixed', 'Fixed'], ['Dismissed', 'Dismissed'], ['Resolved', 'Resolved by edit']].map(([v, l]) => opt(v, l, status)).join('')}</select>
    </div>
    ${rows.length ? rows.map((f) => `
      <div class="flag ${esc(f.impact)}" data-id="${f.id}">
        <div>
                    <div class="loc">${esc(f.course)} › ${esc(f.location)}
            ${isNew(f) ? '<span class="badge sample">NEW</span>' : ''}
            ${f.isSample ? '<span class="badge sample">SAMPLE</span>' : ''}</div>
          <div class="meta">${esc(f.vendor || '')} · ${esc((f.changeDate || '').slice(0, 10))} · ${esc(f.title || '')}</div>
        </div>
        <div class="right"><span class="badge ${esc(f.impact)}">${esc(f.impact)}</span><div class="meta">${esc(f.status)}</div></div>
      </div>`).join('') : '<div class="empty">No flags match these filters.</div>'}`;

  const go = () => {
    const p = new URLSearchParams({ course: fCourse.value, impact: fImpact.value, status: fStatus.value });
    location.hash = '#/flags?' + p;
  };
  ['fCourse', 'fImpact', 'fStatus'].forEach((id) => (document.getElementById(id).onchange = go));
  app.querySelectorAll('.flag').forEach((el) => (el.onclick = () => (location.hash = '#/flag/' + el.dataset.id)));
}

// ---------------- One flag ----------------
async function viewFlag(id) {
  const f = await api('/flags/' + id);
  app.innerHTML = `
    <p><a href="#/flags">← Back to flags</a></p>
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div><h2 style="margin:0">${esc(f.course)}</h2><div class="meta">${esc(f.location)}</div></div>
      <div class="right">
        <span class="badge ${esc(f.impact)}">${esc(f.impact)} impact</span>
        ${f.isSample ? '<span class="badge sample">SAMPLE</span>' : ''}
        <div class="meta">Status: <b>${esc(f.status)}</b></div>
      </div>
    </div>
    <div class="cols">
      <div class="box">
        <div class="lbl">What changed (official vendor source)</div>
        <b>${esc(f.title || '')}</b>
        <div class="meta">${esc(f.vendor || '')} · ${esc((f.changeDate || '').slice(0, 10))} · ${esc(f.changeType || '')}</div>
        <p>${esc((f.summary || '').slice(0, 600))}</p>
        ${f.link ? `<a href="${esc(f.link)}" target="_blank" rel="noopener">Open official announcement ↗</a>` : ''}
      </div>
      <div class="box">
        <div class="lbl">What our course says now</div>
                ${f.fileUrl ? `<p><a href="${esc(f.fileUrl)}" target="_blank" rel="noopener">📄 Open ${esc(f.fileName || 'file')} in SharePoint ↗</a></p>` : ''}
        <div class="quote">${esc(f.currentText || '')}</div>
      </div>
    </div>
    <div class="box ai">
      <div class="lbl">AI assessment — AI-drafted, please verify against the official source</div>
      <p><b>Why it's flagged:</b> ${esc(f.reason || '')}</p>
      <p><b>Suggested update:</b> ${esc(f.suggestedText || '')}</p>
      <div class="meta">Confidence ${Math.round((f.confidence || 0) * 100)}% · checked by ${esc(f.checkedBy || '–')}</div>
    </div>
    <div class="box" style="margin-top:14px">
      <div class="lbl">Your review</div>
      <textarea id="note" rows="2" style="width:100%" placeholder="Optional note (e.g. why it's a false alarm)"></textarea>
      <div class="btns">
        <button class="b-accept" data-a="Accepted">Accept – needs update</button>
        <button class="b-dismiss" data-a="Dismissed">Dismiss – false alarm</button>
        <button class="b-fixed" data-a="Fixed">Mark fixed</button>
      </div>
      ${f.history.length ? `<h2>History</h2><table><tr><th>When</th><th>Action</th><th>Note</th></tr>
        ${f.history.map((h) => `<tr><td>${fmtDate(h.at)}</td><td>${esc(h.action)}</td><td>${esc(h.note)}</td></tr>`).join('')}</table>` : ''}
    </div>`;

  app.querySelectorAll('[data-a]').forEach((b) => {
    b.onclick = async () => {
      await api(`/flags/${id}/action`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: b.dataset.a, note: document.getElementById('note').value }),
      });
      viewFlag(id);
    };
  });
}

// ---------------- Vendor news ----------------
async function viewNews() {
  const rows = await api('/news');
  app.innerHTML = `
    <h2>Latest vendor announcements</h2>
    <table>
      <tr><th>Date</th><th>Vendor</th><th>Announcement</th><th>Triage</th></tr>
      ${rows.map((r) => `
        <tr>
          <td>${esc((r.d || '').slice(0, 10))}</td>
          <td>${esc(r.vendor)}</td>
          <td><a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.title)}</a></td>
          <td>${r.relevant === 1 ? `<span class="badge Medium">Relevant</span><div class="meta">${esc(JSON.parse(r.courses || '[]').join(', '))}</div>`
               : r.relevant === 0 ? '<span class="meta">Not relevant</span>' : '<span class="meta">Not triaged yet</span>'}</td>
        </tr>`).join('')}
    </table>`;
}

// ---------------- Emails ----------------
async function viewEmails() {
  const rows = await api('/notifications');
  app.innerHTML = `
    <h2>Emails sent by the tool ${rows[0]?.mode === 'preview' ? '<span class="badge Medium">Preview mode – not actually sent</span>' : ''}</h2>
    ${rows.length ? `<table>
      <tr><th>When</th><th>Type</th><th>To</th><th>Subject</th><th>Flags</th></tr>
      ${rows.map((r) => `
        <tr class="email-row" data-id="${r.id}" style="cursor:pointer">
          <td>${fmtDate(r.at)}</td><td>${esc(r.type)}</td><td>${esc(r.recipients)}</td>
          <td>${esc(r.subject)}</td><td>${JSON.parse(r.flagIds || '[]').length}</td>
        </tr>`).join('')}
    </table>
    <h2>Preview</h2>
    <iframe id="emailPreview" title="Email preview" sandbox="allow-popups allow-popups-to-escape-sandbox"
            style="width:100%;height:640px;border:1px solid var(--line);border-radius:10px;background:#fff"></iframe>`
    : '<div class="empty">No emails yet. Run "npm run notify".</div>'}`;

  const frame = document.getElementById('emailPreview');
  const show = (id) => { if (frame) frame.src = `/api/notifications/${id}/html`; };
  app.querySelectorAll('.email-row').forEach((tr) => (tr.onclick = () => show(tr.dataset.id)));
  if (rows[0]) show(rows[0].id);
}

// ---------------- "Run now" ----------------
const runBtn = document.getElementById('runBtn');
const runPanel = document.getElementById('runPanel');
const runLog = document.getElementById('runLog');
const runStatus = document.getElementById('runStatus');
document.getElementById('runClose').onclick = () => runPanel.classList.add('hidden');

async function pollRun() {
  const s = await api('/run/status');
  runPanel.classList.remove('hidden');
  runLog.textContent = s.log.join('\n');
  runLog.scrollTop = runLog.scrollHeight;               // follow the latest line

  if (s.running) {
    const secs = Math.round((Date.now() - new Date(s.startedAt)) / 1000);
    runStatus.textContent = `⏳ Running… ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    runBtn.disabled = true;
    setTimeout(pollRun, 1500);
  } else {
        const n = s.lastRun?.newFlags ?? 0;
    runStatus.innerHTML = (s.exitCode === 0 ? '✅ Finished – all steps OK' : '❌ Finished with errors') +
      ` · <b>${n} new flag${n === 1 ? '' : 's'}</b>` +
      (n ? ` · <a href="#/flags?new=1" style="color:#C9B5F0">View new flags</a>` : '');
    runBtn.disabled = false;
    state.lastRun = undefined;                           // reload last-run info on next view
    delete state.lastRun;
    route();                                             // refresh the page with new results                                           // refresh the page with new results
  }
}

runBtn.onclick = async () => {
  runBtn.disabled = true;
  try {
    await api('/run', { method: 'POST' });
  } catch (e) {
    if (!/already/i.test(e.message)) { runBtn.disabled = false; runStatus.textContent = `❌ ${e.message}`; return; }
  }
  pollRun();
};

// If a run is already going when the page opens, reconnect to it
api('/run/status').then((s) => { if (s.running) pollRun(); }).catch(() => {});

// ---------------- Simple router ----------------
function route() {
  const [path, query] = (location.hash || '#/').slice(1).split('?');
  document.querySelectorAll('nav a').forEach((a) => {
    const r = a.dataset.r;
    a.classList.toggle('active',
      (r === 'overview' && path === '/') || (r === 'flags' && path.startsWith('/flag')) ||
      (r === 'news' && path === '/news') || (r === 'emails' && path === '/emails'));
  });
  const view = path.startsWith('/flag/') ? viewFlag(path.split('/')[2])
             : path.startsWith('/flags') ? viewFlags(query || '')
             : path === '/news' ? viewNews()
             : path === '/emails' ? viewEmails()
             : viewOverview();
  view.catch((e) => (app.innerHTML = `<div class="error">Could not load: ${esc(e.message)}</div>`));
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
